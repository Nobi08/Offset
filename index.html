<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offset Calculator</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --border:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#22c55e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    padding:16px;
  }
  h1{font-size:18px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 16px;}
  .formula{
    display:inline-block; background:var(--panel); border:1px solid var(--border);
    padding:6px 12px; border-radius:8px; font-size:13px; margin-bottom:14px; color:var(--accent);
  }
  .table-wrap{
    overflow-x:auto; border:1px solid var(--border); border-radius:10px;
  }
  table{border-collapse:collapse; width:100%; min-width:560px;}
  thead th{
    position:sticky; top:0; background:#111827; color:var(--text);
    font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    padding:10px 8px; border-bottom:1px solid var(--border); text-align:center;
  }
  tbody td{
    border-bottom:1px solid var(--border); padding:6px; text-align:center;
  }
  tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  input[type=number]{
    width:90px; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:6px;
    padding:8px 6px; font-size:14px; text-align:center;
  }
  input[type=number]:focus{outline:none; border-color:var(--accent);}
  .rownum{color:var(--muted); font-size:12px;}
  .result{
    font-weight:600; color:var(--accent2); font-size:14px;
  }
  .toolbar{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;}
  button{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:9px 14px; border-radius:8px; font-size:13px;
  }
  button:active{background:#273449;}
</style>
</head>
<body>

<h1>Offset Calculator</h1>
<p class="sub">Enter H, D, A for each row — Offset (O) calculates automatically.</p>
<div class="formula">O = (D ÷ 2) + A − H</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Holes from Edge (H)</th>
      <th>Dia (D)</th>
      <th>Actual Dia (A)</th>
      <th>Offset (O)</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div class="toolbar">
  <button id="clearBtn">Clear All</button>
</div>

<script>
  const rowsEl = document.getElementById('rows');
  const ROWS = 20;

  for (let i = 1; i <= ROWS; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rownum">${i}</td>
      <td><input type="number" step="any" class="h" inputmode="decimal"></td>
      <td><input type="number" step="any" class="d" inputmode="decimal"></td>
      <td><input type="number" step="any" class="a" inputmode="decimal"></td>
      <td class="result o">—</td>
    `;
    rowsEl.appendChild(tr);
  }

  function calcRow(tr) {
    const h = parseFloat(tr.querySelector('.h').value);
    const d = parseFloat(tr.querySelector('.d').value);
    const a = parseFloat(tr.querySelector('.a').value);
    const oCell = tr.querySelector('.o');
    if (isNaN(h) || isNaN(d) || isNaN(a)) {
      oCell.textContent = '—';
      return;
    }
    const o = (d / 2) + a - h;
    oCell.textContent = o.toFixed(3);
  }

  rowsEl.addEventListener('input', (e) => {
    const tr = e.target.closest('tr');
    if (tr) calcRow(tr);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(i => i.value = '');
    document.querySelectorAll('.o').forEach(o => o.textContent = '—');
  });
</script>

</body>
</html>
