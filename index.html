<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offset Calculator</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --border:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#22c55e; --warn:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    padding:16px;
  }
  h1{font-size:18px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 16px;}
  .formula{
    display:inline-block; background:var(--panel); border:1px solid var(--border);
    padding:6px 12px; border-radius:8px; font-size:12px; margin-bottom:6px; color:var(--accent);
  }
  .formula2{ display:block; margin-top:6px; }
  .table-wrap{
    overflow-x:auto; border:1px solid var(--border); border-radius:10px; margin-top:14px;
  }
  table{border-collapse:collapse; width:100%; min-width:680px;}
  thead th{
    position:sticky; top:0; background:#111827; color:var(--text);
    font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    padding:10px 6px; border-bottom:1px solid var(--border); text-align:center;
  }
  tbody td{
    border-bottom:1px solid var(--border); padding:6px; text-align:center;
  }
  tbody tr:nth-child(even){background:rgba(255,255,255,0.02);}
  input[type=number]{
    width:85px; background:var(--bg); color:var(--text);
    border:1px solid var(--border); border-radius:6px;
    padding:8px 6px; font-size:14px; text-align:center;
  }
  input[type=number]:focus{outline:none; border-color:var(--accent);}
  .rownum{color:var(--muted); font-size:12px;}
  .result{font-weight:600; font-size:14px; color:var(--accent2);}
  .offset-neg{color:var(--warn);}
  .toolbar{margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;}
  button{
    background:var(--panel); color:var(--text); border:1px solid var(--border);
    padding:9px 14px; border-radius:8px; font-size:13px;
  }
  button:active{background:#273449;}
</style>
</head>
<body>

<h1>Offset Calculator</h1>
<p class="sub">Enter Spec, Value from Hole Edge, and Actual Dia for each row.</p>
<div class="formula">Actual Y/Z = (Actual Dia ÷ 2) + Value from Hole Edge</div>
<div class="formula formula2">Offset = Actual Y/Z − Spec (Y or Z axis)</div>

<div class="table-wrap">
<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Spec (Y/Z Axis)</th>
      <th>Value from Hole Edge</th>
      <th>Actual Dia</th>
      <th>Actual Y/Z</th>
      <th>Offset</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
</div>

<div class="toolbar">
  <button id="clearBtn">Clear All</button>
</div>

<script>
  const rowsEl = document.getElementById('rows');
  const ROWS = 20;

  for (let i = 1; i <= ROWS; i++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="rownum">${i}</td>
      <td><input type="number" step="any" class="spec" inputmode="decimal"></td>
      <td><input type="number" step="any" class="edge" inputmode="decimal"></td>
      <td><input type="number" step="any" class="adia" inputmode="decimal"></td>
      <td class="result yz">—</td>
      <td class="result offset">—</td>
    `;
    rowsEl.appendChild(tr);
  }

  function calcRow(tr) {
    const spec = parseFloat(tr.querySelector('.spec').value);
    const edge = parseFloat(tr.querySelector('.edge').value);
    const adia = parseFloat(tr.querySelector('.adia').value);
    const yzCell = tr.querySelector('.yz');
    const offCell = tr.querySelector('.offset');

    if (isNaN(edge) || isNaN(adia)) {
      yzCell.textContent = '—';
      offCell.textContent = '—';
      offCell.classList.remove('offset-neg');
      return;
    }

    const actualYZ = (adia / 2) + edge;
    yzCell.textContent = actualYZ.toFixed(3);

    if (isNaN(spec)) {
      offCell.textContent = '—';
      offCell.classList.remove('offset-neg');
      return;
    }

    const offset = actualYZ - spec;
    offCell.textContent = offset.toFixed(3);
    offCell.classList.toggle('offset-neg', offset < 0);
  }

  rowsEl.addEventListener('input', (e) => {
    const tr = e.target.closest('tr');
    if (tr) calcRow(tr);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    document.querySelectorAll('input').forEach(i => i.value = '');
    document.querySelectorAll('.result').forEach(o => { o.textContent = '—'; o.classList.remove('offset-neg'); });
  });
</script>

</body>
</html>
